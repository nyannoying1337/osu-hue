name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore OsuHue.Tests/OsuHue.Tests.csproj --locked-mode
      - name: Check app formatting
        run: dotnet format OsuHue/OsuHue.csproj --no-restore --verify-no-changes
      - name: Run regression checks
        run: dotnet run --project OsuHue.Tests/OsuHue.Tests.csproj -c Release --no-restore
      - name: Publish Windows app
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osu-hue-windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
